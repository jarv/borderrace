name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run check
      - name: Install browser runtime
        run: mise exec -- npx playwright install --with-deps chromium
      - run: mise run test:browser
      - run: mise run test:release
      - name: Test local database permissions and scoring
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-only.apps.googleusercontent.com
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-only-not-a-real-secret
        run: |
          mise run db:start
          mise run test:db

  release:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: mise run release
