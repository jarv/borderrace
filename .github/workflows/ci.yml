name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run check
      - name: Install browser runtime
        run: mise exec -- npx playwright install --with-deps chromium
      - run: mise run test:browser
      - name: Test release artifact
        run: mise run test:release
      - name: Test local database permissions and scoring
        run: |
          mise run db:start
          mise run test:db
